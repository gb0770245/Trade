<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="hdGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#hdGrad)"/>
  
  <!-- Inner Rim Border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#2dd4bf" stroke-width="6" opacity="0.4"/>
  
  <!-- Central Emblem / Energy Symbol -->
  <g transform="translate(256, 220)">
    <!-- Energy Bolt / Green Leaf Core -->
    <path d="M-40 -120 L20 -120 L-10 -20 L50 -20 L-60 120 L-25 10 L-70 10 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
  </g>
  
  <!-- Brand Text "NEXA AI" -->
  <text x="256" y="410" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="4">NEXA AI</text>
  <text x="256" y="450" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="20" fill="#5eead4" text-anchor="middle" letter-spacing="2">SMARTER TODAY • BIGGER TOMORROW</text>
</svg>
